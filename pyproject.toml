[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-bridge"
version = "0.1.0"
description = "Autonomous gateway for dynamic protocol adaptation and semantic routing between AI agents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Andrew Young", email = "research@automate-capture.com" },
]
keywords = ["agent", "protocol", "middleware", "ai", "routing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0",
    "typer>=0.9",
    "aiohttp>=3.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.20",
    "pytest-cov",
    "ruff",
    "mypy>=0.990",
]
docs = [
    "mkdocs-material>=9.5",
    "pymdown-extensions>=10.0",
]

[project.scripts]
openclaw-gateway = "openclaw_gateway.cli:app"

[project.urls]
Homepage = "https://github.com/Lumi-node/agent-bridge"
Documentation = "https://lumi-node.github.io/agent-bridge/"
Repository = "https://github.com/Lumi-node/agent-bridge"
Issues = "https://github.com/Lumi-node/agent-bridge/issues"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
